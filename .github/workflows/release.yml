name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Check that the tag matches the package version
      run: |
        package_version="$(python -c 'from rireki import __version__; print(__version__)')"
        tag_version="${GITHUB_REF_NAME#v}"

        if [ "$package_version" != "$tag_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match rireki.__version__ ($package_version)"
          exit 1
        fi
    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rireki
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rireki
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
