[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rireki"
dynamic = ["version"]
description = "CLI backup tool."
readme = "README.md"
license = "MIT"
authors = [{name = "Noel De Martin", email = "noeldemartin@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0,<9.0",
    "toml>=0.10.0,<0.11.0",
]

[project.optional-dependencies]
test = [
    "Faker>=2.0.3",
    "pytest",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/noeldemartin/rireki"

[project.scripts]
rireki = "rireki.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "rireki.__version__"}

[tool.setuptools.packages.find]
exclude = ["rireki.testing"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
extend-select = ["E", "W", "C90", "I", "UP", "BLE", "DTZ"]
# Backup dates and log timestamps are intentionally in local time.
extend-ignore = ["DTZ006"]

[tool.ruff.lint.mccabe]
max-complexity = 10
